<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser-cad</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        background: #1e2228;
        color: #e6e8ea;
      }
      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid #333a42;
      }
      h1 {
        font-size: 1rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .part {
        font-size: 0.8125rem;
        color: #9aa3ad;
        margin: 0;
      }
      #status {
        margin: 0;
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      #status[data-state="done"] {
        color: #7fd1a0;
      }
      #status[data-state="error"] {
        color: #ff8a8a;
      }
      #export-stl {
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #e6e8ea;
        background: #2f6f4e;
        border: 1px solid #3d8a62;
        border-radius: 4px;
        padding: 0.3rem 0.85rem;
        cursor: pointer;
      }
      #export-stl:hover:not(:disabled) {
        background: #37815b;
      }
      #export-stl:disabled {
        background: #2a2f36;
        border-color: #3a424b;
        color: #6d7681;
        cursor: not-allowed;
      }
      #note {
        margin: 0;
        font-size: 0.75rem;
        color: #9aa3ad;
        min-width: 14ch;
      }
      /* The canvas sizes itself to this element, so it must have a real height
         of its own rather than being driven by its content. */
      #viewport {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      #viewport canvas {
        display: block;
      }
      #error {
        flex: none;
        margin: 0;
        white-space: pre-wrap;
        color: #ffd4d4;
        background: #3a1d20;
        border-top: 2px solid #ff8a8a;
        padding: 0.75rem 1.25rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8125rem;
        max-height: 30vh;
        overflow: auto;
      }
      .hint {
        flex: none;
        margin: 0;
        padding: 0.5rem 1.25rem;
        font-size: 0.75rem;
        color: #7d8793;
        border-top: 1px solid #333a42;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>browser-cad</h1>
      <p class="part">40 &times; 30 &times; 10 mm plate, 10 mm hole through the centre</p>
      <p id="status">Starting…</p>
      <!-- Disabled in the markup, not just from script: there is a window
           between parsing this and main.ts running where it would otherwise
           be clickable with no part to export. -->
      <button id="export-stl" type="button" disabled>Export STL</button>
      <p id="note"></p>
    </header>
    <div id="viewport"></div>
    <p class="hint">
      Drag to orbit &middot; scroll to zoom &middot; right-drag to pan &middot; grid
      squares are 10 mm &middot; X red, Y green, Z blue
    </p>
    <pre id="error" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
