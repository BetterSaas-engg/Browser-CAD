<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>browser-cad</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        background: #1e2228;
        color: #e6e8ea;
      }
      header {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid #333a42;
      }
      h1 {
        font-size: 1rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: 0.02em;
      }
      #status {
        margin: 0;
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      #status[data-state="done"] {
        color: #7fd1a0;
      }
      #status[data-state="error"] {
        color: #ff8a8a;
      }
      #export-stl {
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #e6e8ea;
        background: #2f6f4e;
        border: 1px solid #3d8a62;
        border-radius: 4px;
        padding: 0.3rem 0.85rem;
        cursor: pointer;
      }
      #export-stl:hover:not(:disabled) {
        background: #37815b;
      }
      #export-stl:disabled {
        background: #2a2f36;
        border-color: #3a424b;
        color: #6d7681;
        cursor: not-allowed;
      }
      #note {
        margin: 0;
        font-size: 0.75rem;
        color: #9aa3ad;
        min-width: 14ch;
      }

      main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      #controls {
        flex: none;
        width: 17rem;
        padding: 0.75rem 1rem 2rem;
        border-right: 1px solid #333a42;
        overflow-y: auto;
      }
      #controls h2 {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7d8793;
        margin: 1.1rem 0 0.4rem;
      }
      #controls h2:first-child {
        margin-top: 0;
      }
      #item-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #item-list button.item {
        font: inherit;
        font-size: 0.8125rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        text-align: left;
        color: #e6e8ea;
        background: #262b32;
        border: 1px solid #3a424b;
        border-radius: 4px;
        padding: 0.3rem 0.5rem;
        margin-bottom: 0.25rem;
        cursor: pointer;
      }
      #item-list button.item[aria-current="true"] {
        border-color: #5c9ded;
        background: #2b3644;
      }
      .op {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 3px;
        padding: 0.05rem 0.3rem;
      }
      .op-add {
        color: #7fd1a0;
        background: #233a2e;
      }
      .op-cut {
        color: #ffb38a;
        background: #3a2d23;
      }
      .item-buttons {
        display: flex;
        gap: 0.25rem;
        margin-top: 0.4rem;
      }
      .item-buttons button {
        font: inherit;
        font-size: 0.75rem;
        flex: 1 1 auto;
        color: #e6e8ea;
        background: #2a3038;
        border: 1px solid #3a424b;
        border-radius: 4px;
        padding: 0.25rem 0.2rem;
        cursor: pointer;
      }
      .item-buttons button:hover:not(:disabled) {
        background: #343c46;
      }
      .item-buttons button:disabled {
        color: #5c646d;
        cursor: not-allowed;
      }
      #item-up,
      #item-down {
        flex: 0 0 2rem;
      }
      .note-inline {
        margin: -0.5rem 0 0.9rem;
        font-size: 0.7rem;
        color: #7d8793;
      }
      .field {
        display: block;
        margin-bottom: 0.9rem;
      }
      .field > span:first-child {
        display: block;
        font-size: 0.75rem;
        color: #9aa3ad;
        margin-bottom: 0.2rem;
      }
      .field select,
      .field input {
        font: inherit;
        font-size: 0.875rem;
        width: 100%;
        box-sizing: border-box;
        color: #e6e8ea;
        background: #262b32;
        border: 1px solid #3a424b;
        border-radius: 4px;
        padding: 0.3rem 0.5rem;
      }
      .field input.invalid {
        border-color: #ff8a8a;
        background: #332326;
      }
      .field-error {
        display: block;
        min-height: 1.1em;
        font-size: 0.7rem;
        color: #ff8a8a;
      }

      /* The canvas sizes itself to this element, so it must have a real height
         of its own rather than being driven by its content. */
      #viewport {
        flex: 1 1 auto;
        min-width: 0;
        position: relative;
      }
      #viewport canvas {
        display: block;
      }
      #error {
        flex: none;
        margin: 0;
        white-space: pre-wrap;
        color: #ffd4d4;
        background: #3a1d20;
        border-top: 2px solid #ff8a8a;
        padding: 0.75rem 1.25rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8125rem;
        max-height: 30vh;
        overflow: auto;
      }
      .hint {
        flex: none;
        margin: 0;
        padding: 0.5rem 1.25rem;
        font-size: 0.75rem;
        color: #7d8793;
        border-top: 1px solid #333a42;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>browser-cad</h1>
      <p id="status">Starting…</p>
      <!-- Disabled in the markup, not just from script: there is a window
           between parsing this and main.ts running where it would otherwise
           be clickable with no shape to export. -->
      <button id="export-stl" type="button" disabled>Export STL</button>
      <p id="note"></p>
    </header>
    <main>
      <div id="controls"></div>
      <div id="viewport"></div>
    </main>
    <p class="hint">
      Drag to orbit &middot; scroll to zoom &middot; right-drag to pan &middot; grid
      squares are 10 mm &middot; X red, Y green, Z blue
    </p>
    <pre id="error" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
